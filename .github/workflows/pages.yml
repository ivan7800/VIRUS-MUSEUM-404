name: VIRUS MUSEUM 404 - QA
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript and Python checks
        shell: bash
        run: |
          set -euo pipefail
          for file in assets/js/*.js; do node --check "$file"; done
          for test in tests/*.mjs; do node "$test"; done
          python -m py_compile servidor.py tests/*.py
          python tests/repository_integrity.py
      - name: Browser integration (real HTTP + Chromium)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          python tests/browser_http_smoke.py
